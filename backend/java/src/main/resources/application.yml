spring:
  application:
    name: cert-practice-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/cert_practice}
    username: ${DATABASE_USERNAME:cert_practice}
    password: ${DATABASE_PASSWORD:local-only-password}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 5000
      validation-timeout: 3000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/seed
    baseline-on-migrate: false
    clean-disabled: true
    validate-on-migrate: true
  session:
    timeout: ${SESSION_TIMEOUT_MINUTES:30}m
    jdbc:
      initialize-schema: never
      table-name: SPRING_SESSION
  servlet:
    multipart:
      max-file-size: ${UPLOAD_MAX_FILE_SIZE:10MB}
      max-request-size: ${UPLOAD_MAX_REQUEST_SIZE:12MB}
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
    include-exception: false
  servlet:
    session:
      cookie:
        name: SESSION
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%X{traceId:-no-trace}] %logger{36} - %msg%n"
  level:
    root: INFO
    com.certpractice: INFO

app:
  ai:
    base-url: ${JAVA_AI_BASE_URL:http://localhost:8000}
    service-token: ${JAVA_AI_SERVICE_TOKEN:local-internal-token}
    provider: ${AI_PROVIDER:mock}
    model: ${AI_MODEL:mock-model}
    connect-timeout: ${JAVA_AI_CONNECT_TIMEOUT_SECONDS:5}s
    request-timeout: ${JAVA_AI_REQUEST_TIMEOUT_SECONDS:30}s
    quota:
      daily-request-limit: ${AI_DAILY_REQUEST_LIMIT:10}
      session-turn-limit: ${AI_SESSION_TURN_LIMIT:20}
      max-input-chars: ${AI_MAX_INPUT_CHARS:2000}
      team-daily-budget: ${AI_TEAM_DAILY_BUDGET:1.0}
      reserved-cost: ${AI_RESERVED_COST:0.001}
    context:
      send-official-answer: ${AI_SEND_OFFICIAL_ANSWER:false}
    generation:
      scheduler-enabled: ${AI_GENERATION_SCHEDULER_ENABLED:true}
      poll-delay-ms: ${AI_GENERATION_POLL_DELAY_MS:5000}
      lease-duration: ${AI_GENERATION_LEASE_DURATION:2m}
      max-attempts: ${AI_GENERATION_MAX_ATTEMPTS:3}
      default-target-count: ${AI_GENERATION_DEFAULT_TARGET_COUNT:30}
      prompt-version: ${AI_PROMPT_VERSION:v1}
  practice:
    selection:
      unseen-weight: 0.5
      wrong-weight: 0.3
      normal-weight: 0.2
      easy-weight: 0.3
      medium-weight: 0.5
      hard-weight: 0.2
      max-candidates: 20000
  security:
    cookie-secure: ${SESSION_COOKIE_SECURE:false}
    login-throttle:
      enabled: ${LOGIN_THROTTLE_ENABLED:true}
      max-failures: ${LOGIN_THROTTLE_MAX_FAILURES:5}
      failure-window: ${LOGIN_THROTTLE_FAILURE_WINDOW:15m}
      lock-duration: ${LOGIN_THROTTLE_LOCK_DURATION:15m}
  question:
    import:
      max-file-bytes: ${QUESTION_IMPORT_MAX_FILE_BYTES:10485760}
