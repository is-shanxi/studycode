spring:
  application:
    name: cert-practice-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/cert_practice}
    username: ${DATABASE_USERNAME:cert_practice}
    password: ${DATABASE_PASSWORD:local-only-password}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 5000
      validation-timeout: 3000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/seed
    baseline-on-migrate: false
    clean-disabled: true
    validate-on-migrate: true
  session:
    timeout: ${SESSION_TIMEOUT_MINUTES:30}m
    jdbc:
      initialize-schema: never
      table-name: SPRING_SESSION
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
    include-exception: false
  servlet:
    session:
      cookie:
        name: SESSION
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%X{traceId:-no-trace}] %logger{36} - %msg%n"
  level:
    root: INFO
    com.certpractice: INFO

app:
  ai:
    base-url: ${JAVA_AI_BASE_URL:http://localhost:8000}
    service-token: ${JAVA_AI_SERVICE_TOKEN:local-internal-token}
    connect-timeout: ${JAVA_AI_CONNECT_TIMEOUT_SECONDS:5}s
    request-timeout: ${JAVA_AI_REQUEST_TIMEOUT_SECONDS:30}s
  practice:
    selection:
      unseen-weight: 0.5
      wrong-weight: 0.3
      normal-weight: 0.2
      easy-weight: 0.3
      medium-weight: 0.5
      hard-weight: 0.2
      max-candidates: 20000
  security:
    cookie-secure: ${SESSION_COOKIE_SECURE:false}
