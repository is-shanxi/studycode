openapi: 3.1.0
jsonSchemaDialect: https://spec.openapis.org/oas/3.1/dialect/base
info:
  title: 考证刷题平台 API
  version: 1.0.0
  description: |
    浏览器访问 Java 业务后端的 HTTP 契约。路径相对于 `servers[0].url`，即
    `/api/v1` 之后的部分。字段级业务规则、答案可见性和幂等约定见同目录的
    `http-api.md`。本文件由 `OpenApiContractTest` 与 Spring MVC 路由表双向校验，
    新增或删除接口时必须同步更新。
  contact:
    name: Cert Practice Team
servers:
  - url: http://localhost:8080/api/v1
    description: 本地 Java API
tags:
  - name: health
    description: 服务健康检查
  - name: auth
    description: 注册、登录、退出与会话
  - name: profile
    description: 个人资料、密码与注销
  - name: catalog
    description: 证书、科目、章节与标签
  - name: questions
    description: 公开题库搜索与题目详情
  - name: practice
    description: 练习与自测会话、提交与自评
  - name: records
    description: 记录、收藏与错题
  - name: community
    description: 讨论、评论、举报与纠错
  - name: notifications
    description: 站内通知
  - name: admin
    description: 题目、用户、审核、看板、审计与目录维护
security:
  - cookieAuth: []
paths:
  /health:
    get:
      tags: [health]
      operationId: getHealth
      summary: Java 服务存活检查
      security: []
      responses:
        '200':
          description: 服务正常运行
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /auth/csrf:
    get:
      tags: [auth]
      operationId: getCsrfToken
      summary: 获取当前会话的 CSRF 令牌
      security: []
      responses:
        '200':
          description: CSRF 令牌
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfTokenResponse'
  /auth/register:
    post:
      tags: [auth]
      operationId: register
      summary: 注册普通用户
      description: 不接受客户端角色字段；重复用户名返回 409。
      security:
        - csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: 注册成功并返回会话用户
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
  /auth/sessions:
    post:
      tags: [auth]
      operationId: login
      summary: 用户名密码登录
      description: 连续失败达到阈值后返回 429 LOGIN_LOCKED。
      security:
        - csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/sessions/current:
    delete:
      tags: [auth]
      operationId: logout
      summary: 退出并销毁会话
      security:
        - cookieAuth: []
          csrfToken: []
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/me:
    get:
      tags: [auth]
      operationId: getCurrentUser
      summary: 当前会话用户
      responses:
        '200':
          description: 当前用户
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /me/profile:
    get:
      tags: [profile]
      operationId: getProfile
      summary: 个人资料
      responses:
        '200':
          description: 个人资料
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      tags: [profile]
      operationId: updateProfile
      summary: 修改昵称等允许字段
      security:
        - cookieAuth: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: 更新后的资料
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /me/password:
    put:
      tags: [profile]
      operationId: changePassword
      summary: 校验旧密码后修改密码
      security:
        - cookieAuth: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /me:
    delete:
      tags: [profile]
      operationId: deleteAccount
      summary: 普通用户注销并匿名化
      description: 管理员调用返回 403 ADMIN_CANNOT_DELETE_SELF。
      security:
        - cookieAuth: []
          csrfToken: []
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /catalog/tree:
    get:
      tags: [catalog]
      operationId: getCatalogTree
      summary: 证书、科目、章节树
      description: 只返回 ACTIVE 目录项。
      responses:
        '200':
          description: 目录树
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogTreeResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /tags:
    get:
      tags: [catalog]
      operationId: listTags
      summary: 可用标签
      description: 只返回 ACTIVE 标签。
      responses:
        '200':
          description: 标签列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TagResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /questions/search:
    get:
      tags: [questions]
      operationId: searchQuestions
      summary: 公开题库搜索
      description: 关键词只匹配题干、章节名和标签名，不匹配选项、答案、别名或解析。
      parameters:
        - name: certificateId
          in: query
          schema: {type: string, format: uuid}
        - name: subjectId
          in: query
          schema: {type: string, format: uuid}
        - name: chapterIds
          in: query
          explode: true
          schema:
            type: array
            items: {type: string, format: uuid}
        - name: tagIds
          in: query
          explode: true
          schema:
            type: array
            items: {type: string, format: uuid}
        - name: keyword
          in: query
          schema: {type: string}
        - name: difficulty
          in: query
          explode: true
          schema:
            type: array
            items:
              $ref: '#/components/schemas/Difficulty'
        - name: type
          in: query
          schema:
            $ref: '#/components/schemas/QuestionType'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 分页题目摘要
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuestionSummaryPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /questions/{questionId}:
    parameters:
      - $ref: '#/components/parameters/QuestionIdPath'
    get:
      tags: [questions]
      operationId: getQuestion
      summary: 公开题目安全摘要
      description: 不包含正确答案、参考答案、别名或解析。
      responses:
        '200':
          description: 安全题目视图
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicQuestionView'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /practice-sessions:
    post:
      tags: [practice]
      operationId: createPracticeSession
      summary: 创建练习或自测会话
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSessionRequest'
      responses:
        '201':
          description: 会话安全视图
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /practice-sessions/{sessionId}:
    parameters:
      - $ref: '#/components/parameters/SessionIdPath'
    get:
      tags: [practice]
      operationId: getPracticeSession
      summary: 获取本人会话
      responses:
        '200':
          description: 按状态返回安全或结果视图
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionView'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /practice-sessions/{sessionId}/items/{itemId}/answer:
    parameters:
      - $ref: '#/components/parameters/SessionIdPath'
      - $ref: '#/components/parameters/ItemIdPath'
    put:
      tags: [practice]
      operationId: savePracticeAnswer
      summary: 保存未提交答案
      security:
        - cookieAuth: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveAnswerRequest'
      responses:
        '200':
          description: 保存后的答案版本
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaveAnswerResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /practice-sessions/{sessionId}/submit:
    parameters:
      - $ref: '#/components/parameters/SessionIdPath'
    post:
      tags: [practice]
      operationId: submitPracticeSession
      summary: 提交全部答案
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: 冻结后的结果视图
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultView'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /practice-sessions/{sessionId}/items/{itemId}/self-assessment:
    parameters:
      - $ref: '#/components/parameters/SessionIdPath'
      - $ref: '#/components/parameters/ItemIdPath'
    post:
      tags: [practice]
      operationId: selfAssessPracticeItem
      summary: 提交单题自评
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SelfAssessmentRequest'
      responses:
        '200':
          description: 自评结果与会话状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SelfAssessmentResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /practice-sessions/{sessionId}/abandon:
    parameters:
      - $ref: '#/components/parameters/SessionIdPath'
    post:
      tags: [practice]
      operationId: abandonPracticeSession
      summary: 放弃未提交会话
      security:
        - cookieAuth: []
          csrfToken: []
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /practice-sessions/{sessionId}/result:
    parameters:
      - $ref: '#/components/parameters/SessionIdPath'
    get:
      tags: [practice]
      operationId: getPracticeResult
      summary: 提交后的成绩与逐题解析
      responses:
        '200':
          description: 结果视图
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultView'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /me/records:
    get:
      tags: [records]
      operationId: listPracticeRecords
      summary: 当前用户练习记录
      parameters:
        - name: mode
          in: query
          schema:
            $ref: '#/components/schemas/SessionMode'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/SessionStatus'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 分页记录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordSummaryPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /me/records/{sessionId}:
    parameters:
      - $ref: '#/components/parameters/SessionIdPath'
    get:
      tags: [records]
      operationId: getPracticeRecord
      summary: 记录详情，使用当时题目版本
      responses:
        '200':
          description: 结果视图
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultView'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /me/favorites:
    get:
      tags: [records]
      operationId: listFavorites
      summary: 收藏列表
      responses:
        '200':
          description: 收藏题目
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FavoriteView'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /me/favorites/{questionId}:
    parameters:
      - $ref: '#/components/parameters/QuestionIdPath'
    put:
      tags: [records]
      operationId: addFavorite
      summary: 收藏题目，幂等
      security:
        - cookieAuth: []
          csrfToken: []
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [records]
      operationId: removeFavorite
      summary: 取消收藏，幂等
      security:
        - cookieAuth: []
          csrfToken: []
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /me/wrong-questions:
    get:
      tags: [records]
      operationId: listWrongQuestions
      summary: 当前激活错题
      responses:
        '200':
          description: 错题列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WrongQuestionView'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /me/wrong-questions/{questionId}:
    parameters:
      - $ref: '#/components/parameters/QuestionIdPath'
    delete:
      tags: [records]
      operationId: removeWrongQuestion
      summary: 移出错题集，保留历史
      security:
        - cookieAuth: []
          csrfToken: []
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /questions/{questionId}/discussions:
    parameters:
      - $ref: '#/components/parameters/QuestionIdPath'
    get:
      tags: [community]
      operationId: listDiscussions
      summary: 题目帖子列表
      description: 当前用户存在该题进行中会话时返回 409。
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 分页帖子
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostSummaryPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    post:
      tags: [community]
      operationId: createDiscussion
      summary: 发布帖子，绑定当前题目版本
      security:
        - cookieAuth: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePostRequest'
      responses:
        '201':
          description: 新帖子摘要
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /discussions/{postId}:
    parameters:
      - $ref: '#/components/parameters/PostIdPath'
    get:
      tags: [community]
      operationId: getDiscussion
      summary: 帖子与一级评论
      responses:
        '200':
          description: 帖子详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /discussions/{postId}/comments:
    parameters:
      - $ref: '#/components/parameters/PostIdPath'
    post:
      tags: [community]
      operationId: createComment
      summary: 发布一级评论或引用回复
      security:
        - cookieAuth: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCommentRequest'
      responses:
        '201':
          description: 新评论
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /discussions/{postId}/report:
    parameters:
      - $ref: '#/components/parameters/PostIdPath'
    post:
      tags: [community]
      operationId: reportDiscussion
      summary: 举报帖子
      description: 重复举报本人未处理的同一内容返回已有记录和 200。
      security:
        - cookieAuth: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportRequest'
      responses:
        '200':
          description: 已存在的举报
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportCreated'
        '201':
          description: 新举报
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /comments/{commentId}/report:
    parameters:
      - $ref: '#/components/parameters/CommentIdPath'
    post:
      tags: [community]
      operationId: reportComment
      summary: 举报评论
      security:
        - cookieAuth: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportRequest'
      responses:
        '200':
          description: 已存在的举报
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportCreated'
        '201':
          description: 新举报
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /correction-reports:
    post:
      tags: [community]
      operationId: createCorrectionReport
      summary: 报告题目答案、题干、解析或标签错误
      security:
        - cookieAuth: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CorrectionReportRequest'
      responses:
        '201':
          description: 新纠错报告
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /me/notifications:
    get:
      tags: [notifications]
      operationId: listNotifications
      summary: 当前用户通知
      parameters:
        - name: unreadOnly
          in: query
          schema: {type: boolean, default: false}
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
