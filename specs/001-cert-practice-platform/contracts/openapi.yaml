          $ref: '#/components/responses/Conflict'
  /admin/catalog/chapters:
    get:
      tags: [admin]
      operationId: adminListChapters
      summary: 章节列表，可按科目过滤
      parameters:
        - name: subjectId
          in: query
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: 章节列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ChapterView'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [admin]
      operationId: adminCreateChapter
      summary: 在指定科目下创建章节
      security:
        - cookieAuth: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChapterCreateRequest'
      responses:
        '201':
          description: 新章节
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChapterView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /admin/catalog/chapters/{chapterId}:
    parameters:
      - $ref: '#/components/parameters/ChapterIdPath'
    put:
      tags: [admin]
      operationId: adminUpdateChapter
      summary: 更新章节，所属科目不可变更
      security:
        - cookieAuth: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChapterUpdateRequest'
      responses:
        '200':
          description: 更新后的章节
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChapterView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /admin/catalog/tags:
    get:
      tags: [admin]
      operationId: adminListTags
      summary: 全部标签，包含停用项
      responses:
        '200':
          description: 标签列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TagView'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [admin]
      operationId: adminCreateTag
      summary: 创建标签
      security:
        - cookieAuth: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TagRequest'
      responses:
        '201':
          description: 新标签
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /admin/catalog/tags/{tagId}:
    parameters:
      - $ref: '#/components/parameters/TagIdPath'
    put:
      tags: [admin]
      operationId: adminUpdateTag
      summary: 重命名或停用标签
      security:
        - cookieAuth: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TagRequest'
      responses:
        '200':
          description: 更新后的标签
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: SESSION
    csrfToken:
      type: apiKey
      in: header
      name: X-XSRF-TOKEN
  parameters:
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 128
    QuestionIdPath:
      name: questionId
      in: path
      required: true
      schema: {type: string, format: uuid}
    SessionIdPath:
      name: sessionId
      in: path
      required: true
      schema: {type: string, format: uuid}
    ItemIdPath:
      name: itemId
      in: path
      required: true
      schema: {type: string, format: uuid}
    PostIdPath:
      name: postId
      in: path
      required: true
      schema: {type: string, format: uuid}
    CommentIdPath:
      name: commentId
      in: path
      required: true
      schema: {type: string, format: uuid}
    NotificationIdPath:
      name: notificationId
      in: path
      required: true
      schema: {type: string, format: uuid}
    BatchIdPath:
      name: batchId
      in: path
      required: true
      schema: {type: string, format: uuid}
    UserIdPath:
      name: userId
      in: path
      required: true
      schema: {type: string, format: uuid}
    VersionIdPath:
      name: versionId
      in: path
      required: true
      schema: {type: string, format: uuid}
    ReportIdPath:
      name: reportId
      in: path
      required: true
      schema: {type: string, format: uuid}
    CertificateIdPath:
      name: certificateId
      in: path
      required: true
      schema: {type: string, format: uuid}
    SubjectIdPath:
      name: subjectId
      in: path
      required: true
      schema: {type: string, format: uuid}
    ChapterIdPath:
      name: chapterId
      in: path
      required: true
      schema: {type: string, format: uuid}
    TagIdPath:
      name: tagId
      in: path
      required: true
      schema: {type: string, format: uuid}
  responses:
    BadRequest:
      description: 请求结构或参数校验失败。
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: 未登录或会话已失效。
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: 已登录但角色或资源所有权不足。
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: 资源不存在，或无权得知其存在。
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: 状态冲突、重复键或幂等请求不一致。
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnprocessableEntity:
      description: 业务规则不满足。
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: 请求频率、登录锁定或 AI 额度超限。
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PayloadTooLarge:
      description: 上传文件超过配置的大小上限。
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ServiceUnavailable:
      description: AI 或依赖暂不可用。
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NoContent:
      description: 操作成功，无响应体。
  schemas:
    Problem:
      type: object
      description: RFC 9457 Problem Details 扩展结构。
      required: [type, title, status, code, traceId]
      properties:
        type: {type: string, format: uri}
        title: {type: string}
        status: {type: integer, minimum: 400, maximum: 599}
        detail: {type: string}
        code: {type: string}
        traceId: {type: string}
        errors:
          type: array
          items:
            type: object
            properties:
              field: {type: string}
              message: {type: string}
    PageMeta:
      type: object
      required: [page, size, total]
      properties:
        page: {type: integer, minimum: 0}
        size: {type: integer, minimum: 1, maximum: 100}
        total: {type: integer, minimum: 0}
    HealthResponse:
      type: object
      required: [status, service, timestamp]
      properties:
        status: {type: string}
        service: {type: string}
        timestamp: {type: string, format: date-time}
    CsrfTokenResponse:
      type: object
      required: [headerName, parameterName, token]
      properties:
        headerName: {type: string}
        parameterName: {type: string}
        token: {type: string}
    RegisterRequest:
      type: object
      required: [username, password, passwordConfirmation]
      properties:
        username: {type: string, minLength: 3, maxLength: 64}
        password: {type: string, minLength: 8, maxLength: 72}
        passwordConfirmation: {type: string, minLength: 8, maxLength: 72}
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: {type: string}
        password: {type: string}
    SessionResponse:
      type: object
      required: [userId, username, roles]
      properties:
        userId: {type: string, format: uuid}
        username: {type: string}
        nickname: {type: string}
        roles:
          type: array
          items: {type: string, enum: [USER, ADMIN]}
    ProfileResponse:
      type: object
      required: [userId, username, status, roles]
      properties:
        userId: {type: string, format: uuid}
        username: {type: string}
        nickname: {type: string}
        status: {type: string, enum: [ACTIVE, DISABLED, DELETED_ANONYMIZED]}
        roles:
          type: array
          items: {type: string, enum: [USER, ADMIN]}
    UpdateProfileRequest:
      type: object
      properties:
        nickname: {type: string, maxLength: 64}
    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword, newPasswordConfirmation]
      properties:
        currentPassword: {type: string}
        newPassword: {type: string, minLength: 8, maxLength: 72}
        newPasswordConfirmation: {type: string, minLength: 8, maxLength: 72}
    CatalogStatus:
      type: string
      enum: [ACTIVE, INACTIVE]
    CatalogTreeResponse:
      type: object
      required: [certificates]
      properties:
        certificates:
          type: array
          items:
            $ref: '#/components/schemas/CertificateNode'
    CertificateNode:
      type: object
      required: [id, code, name, subjects]
      properties:
        id: {type: string, format: uuid}
        code: {type: string}
        name: {type: string}
        subjects:
          type: array
          items:
            $ref: '#/components/schemas/SubjectNode'
    SubjectNode:
      type: object
      required: [id, code, name, chapters]
      properties:
        id: {type: string, format: uuid}
        code: {type: string}
        name: {type: string}
        chapters:
          type: array
          items:
            $ref: '#/components/schemas/ChapterNode'
    ChapterNode:
      type: object
      required: [id, code, name]
      properties:
        id: {type: string, format: uuid}
        code: {type: string}
        name: {type: string}
    TagResponse:
      type: object
      required: [id, name]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
    TagRef:
      type: object
      required: [id, name]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
    ChapterRef:
      type: object
      required: [id, name]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
    QuestionType:
      type: string
      enum: [SINGLE_CHOICE, SINGLE_BLANK]
    Difficulty:
      type: string
      enum: [EASY, MEDIUM, HARD]
    QuestionStatus:
      type: string
      enum: [DRAFT, PENDING_REVIEW, PUBLISHED, OFFLINE]
    SessionMode:
      type: string
      enum: [NORMAL, SELF_TEST]
    SessionStatus:
      type: string
      enum: [IN_PROGRESS, SUBMITTED, PENDING_SELF_ASSESSMENT, COMPLETED, ABANDONED]
    MatchResult:
      type: string
      enum: [NOT_APPLICABLE, MATCH, MISMATCH]
    AssessmentResult:
      type: string
      enum: [PASS, FAIL]
    OptionSafe:
      type: object
      required: [id, key, content]
      properties:
        id: {type: string, format: uuid}
        key: {type: string}
        content: {type: string}
    OptionAdmin:
      type: object
      required: [id, key, content, correct]
      properties:
        id: {type: string, format: uuid}
        key: {type: string}
        content: {type: string}
        correct: {type: boolean}
    OptionInput:
      type: object
      required: [key, content, correct]
      properties:
        key: {type: string, maxLength: 8}
        content: {type: string}
        correct: {type: boolean}
    QuestionSummary:
      type: object
      required: [questionId, questionVersionId, type, stem, difficulty, tags, status]
      properties:
        questionId: {type: string, format: uuid}
        questionVersionId: {type: string, format: uuid}
        type:
          $ref: '#/components/schemas/QuestionType'
        stem: {type: string}
        difficulty:
          $ref: '#/components/schemas/Difficulty'
        chapter:
          $ref: '#/components/schemas/ChapterRef'
        tags:
          type: array
          items:
            $ref: '#/components/schemas/TagRef'
        status: {type: string}
    PublicQuestionView:
      type: object
      description: 安全题目视图，不包含答案、别名或解析。
      required: [questionId, questionVersionId, type, stem, difficulty, tags, options]
      properties:
        questionId: {type: string, format: uuid}
        questionVersionId: {type: string, format: uuid}
        type:
          $ref: '#/components/schemas/QuestionType'
        stem: {type: string}
        difficulty:
          $ref: '#/components/schemas/Difficulty'
        chapter:
          $ref: '#/components/schemas/ChapterRef'
        tags:
          type: array
          items:
            $ref: '#/components/schemas/TagRef'
        options:
          type: array
          items:
            $ref: '#/components/schemas/OptionSafe'
    QuestionSummaryPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/QuestionSummary'
    CreateQuestionRequest:
      type: object
      required: [subjectId, chapterId, type, stem, difficulty]
      properties:
        subjectId: {type: string, format: uuid}
        chapterId: {type: string, format: uuid}
        type:
          $ref: '#/components/schemas/QuestionType'
        stem: {type: string}
        explanation: {type: string}
        fillReferenceAnswer: {type: string}
        difficulty:
          $ref: '#/components/schemas/Difficulty'
        sourceText: {type: string}
        options:
          type: array
          items:
            $ref: '#/components/schemas/OptionInput'
        aliases:
          type: array
          items: {type: string}
        tagIds:
          type: array
          items: {type: string, format: uuid}
    UpdateDraftRequest:
      type: object
      properties:
        chapterId: {type: string, format: uuid}
        stem: {type: string}
        explanation: {type: string}
        fillReferenceAnswer: {type: string}
        difficulty:
          $ref: '#/components/schemas/Difficulty'
        sourceText: {type: string}
        options:
          type: array
          items:
            $ref: '#/components/schemas/OptionInput'
        aliases:
          type: array
          items: {type: string}
        tagIds:
          type: array
          items: {type: string, format: uuid}
    VersionView:
      type: object
      required: [versionId, versionNo, status, stem, difficulty, authorId, options, aliases, tags]
      properties:
        versionId: {type: string, format: uuid}
        versionNo: {type: integer}
        status:
          $ref: '#/components/schemas/QuestionStatus'
        stem: {type: string}
        explanation: {type: string}
        fillReferenceAnswer: {type: string}
        difficulty:
          $ref: '#/components/schemas/Difficulty'
        sourceText: {type: string}
        authorId: {type: string, format: uuid}
        reviewedBy: {type: string, format: uuid}
        reviewedAt: {type: string, format: date-time}
        publishedAt: {type: string, format: date-time}
        offlineAt: {type: string, format: date-time}
        supersededAt: {type: string, format: date-time}
        options:
          type: array
          items:
            $ref: '#/components/schemas/OptionAdmin'
        aliases:
          type: array
          items: {type: string}
        tags:
          type: array
          items:
            $ref: '#/components/schemas/TagRef'
    AdminQuestionDetail:
      type: object
      required: [questionId, subjectId, type, status, versions]
      properties:
        questionId: {type: string, format: uuid}
        subjectId: {type: string, format: uuid}
        chapterId: {type: string, format: uuid}
        type:
          $ref: '#/components/schemas/QuestionType'
        status:
          $ref: '#/components/schemas/QuestionStatus'
        publishedVersionId: {type: string, format: uuid}
        versions:
          type: array
          items:
            $ref: '#/components/schemas/VersionView'
    AdminQuestionSummary:
      type: object
      required: [questionId, type, status, stem, difficulty, updatedAt]
      properties:
        questionId: {type: string, format: uuid}
        currentVersionId: {type: string, format: uuid}
        type:
          $ref: '#/components/schemas/QuestionType'
        status:
          $ref: '#/components/schemas/QuestionStatus'
        stem: {type: string}
        difficulty:
          $ref: '#/components/schemas/Difficulty'
        updatedAt: {type: string, format: date-time}
    AdminQuestionSummaryPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/AdminQuestionSummary'
    ReviewRequest:
      type: object
      properties:
        comment: {type: string}
        publishNow: {type: boolean}
    QuestionStatusResponse:
      type: object
      required: [questionId, versionId, status]
      properties:
        questionId: {type: string, format: uuid}
        versionId: {type: string, format: uuid}
        status:
          $ref: '#/components/schemas/QuestionStatus'
    ImportErrorView:
      type: object
      required: [rowNumber, code, message]
      properties:
        rowNumber: {type: integer}
        field: {type: string}
        code: {type: string}
        message: {type: string}
    ImportBatchView:
      type: object
      required: [batchId, status, fileName, totalRows, validRows, invalidRows, errors]
      properties:
        batchId: {type: string, format: uuid}
        status: {type: string}
        fileName: {type: string}
        totalRows: {type: integer}
        validRows: {type: integer}
        invalidRows: {type: integer}
        previewExpiresAt: {type: string, format: date-time}
        confirmedAt: {type: string, format: date-time}
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ImportErrorView'
    PracticeFilters:
      type: object
      properties:
        certificateId: {type: string, format: uuid}
        subjectId: {type: string, format: uuid}
        chapterIds:
          type: array
          items: {type: string, format: uuid}
        tagIds:
          type: array
          items: {type: string, format: uuid}
        difficulty:
          type: array
          items:
            $ref: '#/components/schemas/Difficulty'
        historyDays: {type: integer, minimum: 1}
    CompositionSpec:
      type: object
      properties:
        originalRatio: {type: number, minimum: 0, maximum: 1}
        aiVariantRatio: {type: number, minimum: 0, maximum: 1}
    CreateSessionRequest:
      type: object
      required: [mode]
      properties:
        mode:
          $ref: '#/components/schemas/SessionMode'
        filters:
          $ref: '#/components/schemas/PracticeFilters'
        requestedCount: {type: integer, minimum: 1}
        composition:
          $ref: '#/components/schemas/CompositionSpec'
    AnswerView:
      type: object
      required: [answerRevision]
      properties:
        selectedOptionId: {type: string, format: uuid}
        text: {type: string}
        answerRevision: {type: integer}
    SessionItemView:
      type: object
      description: 提交前不包含答案、别名或解析。
      required: [itemId, ordinal, sourceType, selectionBucket, question]
      properties:
        itemId: {type: string, format: uuid}
        ordinal: {type: integer}
        sourceType: {type: string, enum: [ORIGINAL, AI_VARIANT]}
        selectionBucket: {type: string, enum: [UNSEEN, WRONG, NORMAL]}
        question:
          $ref: '#/components/schemas/PublicQuestionView'
        answer:
          $ref: '#/components/schemas/AnswerView'
        autoMatchResult:
          $ref: '#/components/schemas/MatchResult'
        selfAssessmentResult:
          $ref: '#/components/schemas/AssessmentResult'
        finalResult:
          $ref: '#/components/schemas/AssessmentResult'
    BucketCounts:
      type: object
      required: [unseen, wrong, normal]
      properties:
        unseen: {type: integer}
        wrong: {type: integer}
        normal: {type: integer}
    CompositionView:
      type: object
      required: [original, aiVariant, buckets]
      properties:
        original: {type: integer}
        aiVariant: {type: integer}
        buckets:
          $ref: '#/components/schemas/BucketCounts'
    SessionView:
      type: object
      required: [sessionId, mode, status, rowVersion, requestedCount, actualCount, composition, allowedActions, items]
      properties:
        sessionId: {type: string, format: uuid}
        mode:
          $ref: '#/components/schemas/SessionMode'
        status:
          $ref: '#/components/schemas/SessionStatus'
        rowVersion: {type: integer}
        requestedCount: {type: integer}
        actualCount: {type: integer}
        composition:
          $ref: '#/components/schemas/CompositionView'
        allowedActions:
          type: array
          items: {type: string}
        items:
          type: array
          items:
            $ref: '#/components/schemas/SessionItemView'
    AnswerInput:
      type: object
      properties:
        selectedOptionId: {type: string, format: uuid}
        text: {type: string}
    SaveAnswerRequest:
      type: object
      required: [answer]
      properties:
        answerRevision: {type: integer}
        answer:
          $ref: '#/components/schemas/AnswerInput'
    SaveAnswerResponse:
      type: object
      required: [itemId, answerRevision]
      properties:
        itemId: {type: string, format: uuid}
        answerRevision: {type: integer}
    SelfAssessmentRequest:
      type: object
      required: [result]
      properties:
        result:
          $ref: '#/components/schemas/AssessmentResult'
    SelfAssessmentResponse:
      type: object
      required: [itemId, finalResult, sessionStatus]
      properties:
        itemId: {type: string, format: uuid}
        finalResult:
          $ref: '#/components/schemas/AssessmentResult'
        sessionStatus:
          $ref: '#/components/schemas/SessionStatus'
    ResultItemView:
      type: object
      required: [itemId, questionId, questionVersionId, type, stem, difficulty, options]
      properties:
